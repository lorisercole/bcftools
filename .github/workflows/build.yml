name: Build and test
on: [push, pull_request]

jobs:
  build-test-1:
    name: Build & test (EB)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: eessi/github-action-eessi@v3

    - name: Build in EESSI + CMake
      run: |
        module load HTSlib GSL Perl buildenv
    
        mkdir build
        autoreconf -Wno-syntax
        ./configure --enable-libgsl --enable-htslib=$EBROOTHTSLIB --enable-perl-filters --prefix=$(pwd)/build
        make -j
        make install
        make test
      shell: bash

  build-test-2:
    name: Build & test (EESSI-extend)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: eessi/github-action-eessi@v3

    - name: Build in EESSI + EESSI-Extend
      run: |
        module load EESSI-extend
        eb easybuild/bcftools.eb
      shell: bash
